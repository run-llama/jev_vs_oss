[project]
name = "jev-vs"
version = "0.1.0"
description = "Webinar notebook: jev (TypeSafe AI) vs open alternatives on document tasks, with liteparse doing the PDF work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typesafe-sdk>=0.7.1",
    "liteparse>=2.14",
    "modal>=1.5.5",
    "datasets>=3.0",
    "pyarrow>=17",
    "pillow>=10",
    "reportlab>=4.2",
    "pypdf>=5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "lingua-language-detector>=2.1",
    "pytesseract>=0.3.13",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "rapidfuzz>=3.14.6",
    "laya>=0.3.5",
    "gliformer>=0.1.2",
]

[project.scripts]
pdf-info = "jev_vs.scripts.pdf_info:main"
pdf-text = "jev_vs.scripts.pdf_text:main"
pdf-render = "jev_vs.scripts.pdf_render:main"
pdf-orient = "jev_vs.scripts.pdf_orient:main"
build-corpus = "jev_vs.scripts.build_corpus:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_vs"]
